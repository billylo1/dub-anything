<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes -->
  <meta name="color-scheme" content="light dark">
  <title>Videos — Billy Lo</title>
  <meta name="description" content="Watch videos in the Videos — Billy Lo library.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><rect width='24' height='24' rx='6' fill='%230f172a'/><path d='M9.5 7.5v9l7-4.5-7-4.5z' fill='%2338bdf8'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="?" class="brand" aria-label="Videos home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <rect width="24" height="24" rx="6" fill="currentColor" fill-opacity="0.14"/>
            <path d="M9.5 7.5v9l7.5-4.5-7.5-4.5z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">Videos <span class="brand-sub">billylo.ca</span></span>
      </a>

      <div class="header-controls">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" fill="currentColor"/>
          </svg>
          <input
            type="search"
            id="search-input"
            placeholder="Filter videos..."
            aria-label="Filter videos in library"
            autocomplete="off"
          >
        </div>

        <button type="button" id="open-local-btn" class="btn btn-secondary" title="Open local video file or folder">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M2 4.75A1.75 1.75 0 013.75 3h3.865c.464 0 .909.184 1.237.513l1.414 1.414a.25.25 0 00.177.073h5.807c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0116.25 17H3.75A1.75 1.75 0 012 15.25V4.75z" fill="currentColor"/>
          </svg>
          <span>Open Local</span>
        </button>
        <input type="file" id="local-file-input" accept="video/*,.mp4,.webm,.mov,.m4v,.mkv" multiple hidden>
      </div>
    </div>
  </header>

  <main class="layout" id="main-content">
    <section class="stage-section" aria-label="Video player">
      <div class="player-shell">
        <video
          id="video-player"
          class="video-element"
          controls
          playsinline
          preload="metadata"
        >
          Your browser does not support HTML5 video playback.
        </video>
      </div>

      <div class="video-meta-bar">
        <div class="video-info">
          <h1 id="video-title" class="video-title">Loading video...</h1>
          <div class="video-badges" id="video-badges"></div>
        </div>

        <div class="player-actions">
          <div class="speed-group" role="group" aria-label="Playback speed">
            <span class="action-label">Speed</span>
            <button type="button" class="chip speed-btn" data-speed="0.75">0.75x</button>
            <button type="button" class="chip speed-btn is-active" data-speed="1">1x</button>
            <button type="button" class="chip speed-btn" data-speed="1.25">1.25x</button>
            <button type="button" class="chip speed-btn" data-speed="1.5">1.5x</button>
            <button type="button" class="chip speed-btn" data-speed="2">2x</button>
          </div>

          <div class="utility-buttons">
            <button type="button" id="pip-btn" class="btn btn-icon" title="Picture-in-Picture (P)">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                <path d="M3 4.5A1.5 1.5 0 014.5 3h11A1.5 1.5 0 0117 4.5v5a.75.75 0 01-1.5 0v-5h-11v11h4a.75.75 0 010 1.5h-4A1.5 1.5 0 013 15.5v-11z" fill="currentColor"/>
                <rect x="10" y="11" width="7" height="6" rx="1.2" fill="currentColor"/>
              </svg>
              <span>PiP</span>
            </button>

            <button type="button" id="theater-btn" class="btn btn-icon" title="Toggle Theater Mode (T)">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                <rect x="2.5" y="4.5" width="15" height="11" rx="1.75" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <span>Theater</span>
            </button>

            <button type="button" id="share-btn" class="btn btn-icon" title="Copy direct link to this video">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                <path d="M12.232 4.232a2.5 2.5 0 013.536 3.536l-1.225 1.224a.75.75 0 001.061 1.06l1.224-1.224a4 4 0 00-5.656-5.656l-3 3a4 4 0 00.225 5.865.75.75 0 00.977-1.138 2.5 2.5 0 01-.142-3.667l3-3z" fill="currentColor"/>
                <path d="M11.603 7.963a.75.75 0 00-.977 1.138 2.5 2.5 0 01.142 3.667l-3 3a2.5 2.5 0 01-3.536-3.536l1.225-1.224a.75.75 0 00-1.061-1.06l-1.224 1.224a4 4 0 105.656 5.656l3-3a4 4 0 00-.225-5.865z" fill="currentColor"/>
              </svg>
              <span id="share-btn-label">Copy Link</span>
            </button>

            <a id="download-btn" class="btn btn-icon" href="#" download title="Download video file">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" fill="currentColor"/>
                <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" fill="currentColor"/>
              </svg>
              <span>Download</span>
            </a>
          </div>
        </div>
      </div>

      <div class="shortcuts-bar" aria-label="Keyboard shortcuts">
        <span><kbd>Space</kbd> / <kbd>K</kbd> Play/Pause</span>
        <span><kbd>J</kbd> / <kbd>L</kbd> ±10s</span>
        <span><kbd>←</kbd> / <kbd>→</kbd> ±5s</span>
        <span><kbd>M</kbd> Mute</span>
        <span><kbd>F</kbd> Fullscreen</span>
        <span><kbd>T</kbd> Theater</span>
      </div>
    </section>

    <aside class="library-sidebar" aria-label="Videos folder library">
      <div class="sidebar-header">
        <div>
          <h2 class="sidebar-title">In <code>videos/</code></h2>
          <p class="sidebar-subtitle" id="video-count-label">Loading library...</p>
        </div>
      </div>

      <ul class="video-list" id="video-list" role="listbox" aria-label="Available videos"></ul>

      <div class="dropzone-hint" id="dropzone-hint">
        <p>Drop video files anywhere on this page or click <strong>Open Local</strong> to preview additional videos.</p>
      </div>
    </aside>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
