# Google Cloud Build configuration for Dub Anything GPU container
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dub-anything-repo/dub-runner:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    timeout: '2400s'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/dub-anything-repo/dub-runner:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
