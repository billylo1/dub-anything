# `uvx ruff format` and `uvx ruff check` from the repo root.
# The code was written to about 120 columns; a narrower limit rewraps most of it.
line-length = 120
target-version = "py311"

[lint]
# Mistakes, not style: undefined names, unused imports and variables, the classic
# pycodestyle errors, and noqa comments that no longer suppress anything. Named here
# because ruff's own default set grows between releases.
select = ["E4", "E7", "E9", "F", "RUF100"]
ignore = ["E741"]  # `l` for a line
